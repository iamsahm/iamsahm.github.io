# Build the static site and publish it to samholiday1, where the shared
# edge-caddy serves /opt/edge/static/samholiday and reads routing from
# /opt/edge/sites.
#
# Requires DEPLOY_HOST / DEPLOY_USER / DEPLOY_SSH_KEY on this repo's
# `production` environment, with a keypair minted for this repo alone.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to samholiday1
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Trust-on-first-use; pin the host key via a secret to harden.
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Publish site files
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            'mkdir -p /opt/edge/static/samholiday'

          # Near-atomic: every file lands before any is moved into place, and
          # stale files go only once that is done. Without these flags a visitor
          # mid-sync can get HTML whose hashed assets are not up yet.
          rsync -az --delete-after --delay-updates \
            -e "ssh -i ~/.ssh/deploy_key" \
            dist/ "$DEPLOY_USER@$DEPLOY_HOST:/opt/edge/static/samholiday/"

      - name: Apply site file and reload Caddy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          scp -i ~/.ssh/deploy_key deploy/samholiday.caddy \
            "$DEPLOY_USER@$DEPLOY_HOST:/tmp/samholiday.caddy.staged"

          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" 'bash -euo pipefail -s' <<'REMOTE'
          SITE=/opt/edge/sites/samholiday.caddy
          BACKUP=/tmp/samholiday.caddy.backup

          # /opt/edge/sites is shared, so a file that fails validation must be
          # restored rather than left behind — it would fail the next app's
          # deploy too.
          if [ -f "$SITE" ]; then cp "$SITE" "$BACKUP"; else rm -f "$BACKUP"; fi
          mv /tmp/samholiday.caddy.staged "$SITE"

          if ! docker exec edge-caddy caddy validate --config /etc/caddy/Caddyfile; then
            if [ -f "$BACKUP" ]; then mv "$BACKUP" "$SITE"; else rm -f "$SITE"; fi
            echo "samholiday.caddy failed validation; rolled back, running config untouched" >&2
            exit 1
          fi

          docker exec edge-caddy caddy reload --config /etc/caddy/Caddyfile
          rm -f "$BACKUP"
          REMOTE

      - name: Smoke test
        run: |
          set -euo pipefail
          # The first deploy also waits on Caddy's DNS-01 order for the apex.
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS --max-time 20 https://samholiday.co.uk | grep -q "Sam Holiday"; then
              echo "samholiday.co.uk is serving the portfolio"
              exit 0
            fi
            echo "attempt $attempt failed, retrying in 10s"
            sleep 10
          done
          echo "smoke test failed: https://samholiday.co.uk did not serve the site" >&2
          exit 1
